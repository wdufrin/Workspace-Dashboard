server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hide Nginx version string from response headers and error pages
    server_tokens off;

    # Do not log request query parameters or headers
    access_log off;

    # Gzip compression for static assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Hardened Security Headers (applied at server level across all routes)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # Required for Google Identity Services OAuth popup & Looker Studio window.open
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://admin.googleapis.com https://bigquery.googleapis.com https://cloudresourcemanager.googleapis.com https://serviceusage.googleapis.com https://oauth2.googleapis.com https://www.googleapis.com https://accounts.google.com; frame-src https://accounts.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # Cloud Run startup / liveness probe endpoint
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Immutable fingerprinted Vite bundle assets (uses `expires` so server-level `add_header` security headers are preserved)
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Single-Page Application fallback (never cache index.html so updates roll out immediately)
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
